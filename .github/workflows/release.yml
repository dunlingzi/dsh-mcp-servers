name: Release

# Tag-triggered publish：推 vX.Y.Z tag 是唯一发布开关。
# 校验包版本 == tag 版本（tag 是版本唯一来源）→ 全量门禁 →
# pnpm publish（本仓为单插件仓库：唯一发布物 @dunlingzi/dsh-mcp-servers）→ 生成 GitHub Release。
# npm 发布用仓库 secret NPM_TOKEN（@dunlingzi scope 的 npm automation token）。
# 未配置 token 时**跳过** npm 发布（发 notice），tag 校验 / 门禁 / GitHub Release 照常执行
# ——即「打 tag 出 Release」不依赖 npm 凭据；配置 token 后重跑同一 tag 的 run 即可补发。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test, publish, release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        # 版本以根 package.json 的 packageManager 字段为单一事实源（勿同时指定 version）

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify versions（包版本 == tag）
        run: node scripts/release/verify-version.ts

      # fail-closed：release notes 缺失时，下面的「Create GitHub Release」会静默回退
      # GitHub 自动 notes——本仓约定「每版入库 docs/release-notes/vX.Y.Z.md」，故在
      # 发布前就把缺件暴露出来（tag 推送不可逆，失败要发生在 publish 之前）。
      - name: Verify release notes（fail-closed，缺失即中止）
        run: |
          f="docs/release-notes/${{ github.ref_name }}.md"
          if [ ! -f "$f" ]; then
            echo "::error::$f 缺失——按 .dsh/skills/dsh-plugin-release 约定，每版须入库 docs/release-notes/<tag>.md（缺失会被 GitHub 自动 notes 静默替代）"
            exit 1
          fi
          echo "release notes 就位：$f"

      - name: Build
        run: pnpm build

      - name: Contract
        run: pnpm contract

      - name: Tests
        run: pnpm test

      - name: Pack check
        run: pnpm pack:check

      # 发布开关：本步骤只判断 token 是否存在。token 仅在本步骤 env 内可见（不进 job 级
      # env，避免暴露给其余步骤）；GitHub 不允许在 if 里直接引用 secrets，故经 outputs 传递。
      - name: Check npm token（决定是否执行 npm 发布）
        id: npm-token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN 已配置——本次将发布到 npm"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN secret 未配置——跳过 npm 发布，本次 tag 只创建 GitHub Release（在仓库 Settings → Secrets and variables → Actions 配置 @dunlingzi scope 的 npm automation token 后，重跑本 run 即可补发）"
          fi

      - name: Publish to npm（幂等：版本已存在自动跳过）
        if: ${{ steps.npm-token.outputs.present == 'true' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          while read -r pkg; do
            [ -z "$pkg" ] && continue
            echo "==> publish $pkg"
            pnpm --filter "$pkg" publish --no-git-checks
          done < <(node scripts/release/publish-if-missing.ts)

      # Release notes: prefer the agent-curated per-version file committed
      # alongside the release (docs/release-notes/<tag>.md); fall back to
      # GitHub's auto-generated notes only when that file is absent. The two
      # paths are mutually exclusive (body_path vs generate_release_notes).
      - name: Locate release notes
        id: notes
        run: |
          f="docs/release-notes/${{ github.ref_name }}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; else echo "path=" >> "$GITHUB_OUTPUT"; fi

      - name: Create GitHub Release (curated notes)
        if: ${{ steps.notes.outputs.path != '' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: ${{ steps.notes.outputs.path }}

      - name: Create GitHub Release (fallback auto-notes)
        if: ${{ steps.notes.outputs.path == '' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
